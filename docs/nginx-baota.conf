# ============================================================
# Yanny Nginx 配置（宝塔面板）
# 域名: www-pdefe.yuangs.com
# 端口: 80 (HTTP) / 443 (HTTPS)
# ============================================================
# 文件位置: /www/server/panel/vhost/nginx/www-pdefe.yuangs.com.conf
# ============================================================

server
{
    listen 80;
    server_name www-pdefe.yuangs.com;
    index index.html index.htm default.htm default.html;

    # ===================== 根目录：管理后台静态文件 =====================
    # 指向 admin 构建产物 dist 目录
    root /www/wwwroot/yanny-pdefe/admin/dist;

    # Baota 扩展配置（保留不动）
    include /www/server/panel/vhost/nginx/extension/main_go/*.conf;

    # SSL 验证相关
    include /www/server/panel/vhost/nginx/well-known/main_go.conf;

    # ============================================================
    # API 反向代理 —— 必须在 location / 之前，优先级更高
    # 前端请求 /api/* → Go :8088
    # ============================================================
    location /api {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-HOST $remote_addr;

        # 超时（视频上传等场景需要较长超时）
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket 支持（后续实时推送可能需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 文件上传大小限制
        client_max_body_size 100m;
    }

    # ============================================================
    # 管理后台 SPA —— Vue Router history 模式
    # /admin 下所有路径回退到 index.html
    # ============================================================
    location /admin {
        # 先尝试精确匹配文件
        # 找不到文件时回退到 index.html（Vue Router 接管）
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================================
    # 根路径跳转到管理后台
    # ============================================================
    location = / {
        return 302 /admin;
    }

    # ============================================================
    # 安全配置
    # ============================================================

    # 禁止访问的敏感文件（Go 源码 / 配置文件 / 依赖信息）
    location ~* /(\.user\.ini|\.htaccess|config\.yaml|go\.mod|go\.sum|\.env){
        return 404;
    }

    # 禁止访问的敏感目录（源码 / git / IDE）
    location ~* /(\.git|\.svn|\.vscode|\.claude|\.idea|node_modules|service/internal|service/cmd)/ {
        return 404;
    }

    # SSL 验证目录
    location /.well-known/ {
        root /www/wwwroot/java_node_ssl;
    }

    # ============================================================
    # 伪静态（保留 Baota 配置）
    # ============================================================
    include /www/server/panel/vhost/rewrite/go_main_go.conf;

    # ============================================================
    # 日志
    # ============================================================
    access_log /www/wwwlogs/main_go.log;
    error_log  /www/wwwlogs/main_go.error.log;
}
